# Builds the Windows game and installer.
#
# - Pull requests and the "Run workflow" button: tests, then a build you can download from the
#   run's Artifacts section.
# - Pushing a version tag such as v3.0.0: the same, then a GitHub release with the installer and
#   portable ZIP attached.
name: Windows build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest -q -p no:warnings
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Version number
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "number=$(python -c 'import build_windows_installer as b; print(b.VERSION)')" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: python build_windows_installer.py --version ${{ steps.version.outputs.number }} --require-installer
      - uses: actions/upload-artifact@v4
        with:
          name: LazerSharkKillKill-${{ steps.version.outputs.number }}-windows
          path: |
            dist/installer/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" $(find files -type f) --repo "$GITHUB_REPOSITORY" \
            --title "Lazer Shark Kill! Kill! $GITHUB_REF_NAME" --generate-notes
